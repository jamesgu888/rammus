[project]
name = "rammus"
version = "0.1.0"
description = "Rotational Anomaly Monitoring in Motors Using Sound"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "scikit-learn",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rammus"]
